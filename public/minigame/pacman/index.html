<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>오락실 PACMAN</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<style type="text/css">
		body {
			background-color: #0b0b16;
			font-family: 'Noto Sans KR', sans-serif;
		}
		.font-retro {
			font-family: 'Press Start 2P', cursive;
		}
		#pacman {
			height: 470px;
			width: 382px;
			border-radius: 8px;
			margin: 0 auto;
		}
	</style>
  <script src="/_runtime/firebase-config?app=minigame"></script>
  <meta name="author" content="게시판 운영자">
  <meta name="copyright" content="© 2026 게시판">
  <meta name="rights" content="AI 도구를 제작 보조로 활용해 운영자가 기획·구현·편집한 자체 콘텐츠">
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">
	
	<h1 id="game-title-header" class="font-retro text-2xl md:text-3xl font-bold text-yellow-400 mb-2 tracking-wider uppercase text-center drop-shadow-[0_4px_6px_rgba(250,204,21,0.2)]">🕹️ PACMAN 🕹️</h1>
	<p class="text-sm text-gray-400 mb-6 text-center font-medium">방향키로 이동 | 새 게임: <span class="text-yellow-400 font-bold">N</span> | 일시정지: <span class="text-yellow-400 font-bold">P</span> | 소리켜기/끄기: <span class="text-yellow-400 font-bold">S</span></p>

	<div class="flex flex-col lg:flex-row gap-8 items-start justify-center w-full max-w-5xl">
		
		<div class="bg-black p-4 rounded-2xl border-4 border-blue-600 shadow-[0_0_25px_rgba(37,99,235,0.4)] mx-auto" style="position: relative;">
			
			<div id="pacman"></div>

			<div id="customModal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(11, 11, 22, 0.95); z-index: 99; align-items: center; justify-content: center; padding: 16px; font-family: 'Noto Sans KR', sans-serif; border-radius: 12px;">
				<div class="bg-gray-950 border-4 border-yellow-400 rounded-2xl p-7 max-w-sm w-full text-center shadow-[0_0_50px_rgba(250,204,21,0.4)]">
					<h3 id="modalTitle" class="text-xl font-bold text-yellow-400 mb-3 tracking-wide">GAME OVER</h3>
					<p id="modalMessage" class="text-gray-200 mb-6 font-medium text-sm leading-relaxed">최종 점수</p>
					<div id="inputContainer" class="mb-6">
						<input id="modalInput" type="text" maxlength="10" placeholder="아이디 입력 (최대 10자)" 
							   class="w-full bg-black border-2 border-gray-700 focus:border-yellow-400 outline-none rounded-xl px-4 py-2.5 text-center text-white font-semibold">
					</div>
					<div class="flex gap-12 justify-center mt-2">
						<button id="modalCancelBtn" class="px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl font-bold transition-colors text-sm min-w-[90px] border border-gray-700">취소</button>
						<button id="modalConfirmBtn" class="px-5 py-2.5 bg-yellow-400 hover:bg-yellow-500 text-black rounded-xl font-bold transition-colors text-sm min-w-[90px]">등록</button>
					</div>
				</div>
			</div>

		</div>

		<div class="w-full max-w-md bg-gray-950 border-2 border-yellow-400 rounded-2xl p-6 shadow-[0_0_25px_rgba(250,204,21,0.15)] mx-auto">
			<h2 id="leaderboard-title" class="text-xl font-bold text-yellow-400 text-center mb-2 border-b-2 border-yellow-400 pb-3 tracking-wide">🏆 명예의 전당 (Top 10)</h2>
			<p class="text-sm text-emerald-400 text-center mb-5 font-bold tracking-wide">
				🔥 상시 최고 기록 경쟁 중
			</p>
			<div class="overflow-x-auto">
				<table class="w-full text-left text-sm">
					<thead>
						<tr class="text-gray-400 border-b border-gray-800 font-bold text-xs uppercase tracking-wider">
							<th class="py-2.5 w-16 text-center">순위</th>
							<th class="py-2.5 pl-2">아이디</th>
							<th class="py-2.5 text-right pr-4">점수</th>
						</tr>
					</thead>
					<tbody id="leaderboardBody" class="font-medium text-gray-200">
						<tr>
							<td colspan="3" class="text-center py-12 text-gray-500 text-xs">리더보드를 불러오는 중...</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"></script>
	<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>

	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
		import { getFirestore, initializeFirestore, collection, doc, getDoc, setDoc, getDocs, addDoc, deleteDoc, query, orderBy, limit, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
		import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // ────────────────────────────────────────────────────────
        // 🛠️ [모듈 구조 내재화 이식] 외부 파일 변동 없는 완벽 독립 처리
        // ────────────────────────────────────────────────────────
        const minigameConfig = JSON.parse(atob(_mg_fbc));

        const app = initializeApp(minigameConfig);
        const auth = getAuth(app);
		const db = initializeFirestore(app, { experimentalForceLongPolling: true });

		// minigames.js 핵심 데이터 풀 및 마스터 팽창 로직 동일 적용
		const RAW_GAMES = [
			{
				id: 'pacman', 
				name: '👻 팩맨 플레이', 
				label: '팩맨왕' 
			}
		];

		const MASTER_GAMES = RAW_GAMES.map(game => {
			const href = `/minigame/${game.id}/index.html`;
			let rawRanks = game.ranks;
			if (!rawRanks && game.label) {
				rawRanks = [{ key: game.id, label: game.label }];
			} else if (!rawRanks) {
				rawRanks = [{ key: game.id, label: '최강자' }];
			}
			const normalizedRanks = rawRanks.map(r => ({
				key: r.key,
				label: r.label,
				path: r.path || ['artifacts', game.id, 'public', 'data', 'leaderboard']
			}));
			return { ...game, href, ranks: normalizedRanks };
		});

		// 팽창 결과를 통한 동적 경로 추출
		const gameMeta = MASTER_GAMES.find(g => g.id === 'pacman');
		const rankMeta = gameMeta.ranks[0];
		const rankPath = rankMeta.path; // ['artifacts', 'pacman', 'public', 'data', 'leaderboard']
		// ────────────────────────────────────────────────────────

		let currentUser = null;

		window.loadLeaderboard = async function() {
			const tbody = document.getElementById('leaderboardBody');
			try {
				if (tbody) tbody.innerHTML = '';

				// 🌟 동적 경로 배열 주입 연동 처리 적용
				const q = query(collection(db, ...rankPath), orderBy("score", "desc"), limit(10));
				const querySnapshot = await getDocs(q);

				if (querySnapshot.empty) {
					if (tbody) tbody.innerHTML = `<tr><td colspan="3" class="text-center py-8 text-gray-500 text-xs">등록된 순위 기록이 없습니다.</td></tr>`;
					return;
				}

				let index = 0;
				querySnapshot.forEach((docSnap) => {
					const item = docSnap.data(); 
					const row = document.createElement('tr'); 
					row.className = "border-b border-gray-900/60 hover:bg-gray-900/40 transition-colors";
					
					let rankColor = "text-gray-400";
					if (index === 0) rankColor = "text-yellow-400 font-bold text-base";
					else if (index === 1) rankColor = "text-gray-300 font-bold";
					else if (index === 2) rankColor = "text-amber-600 font-bold";

					row.innerHTML = `
						<td class="py-3 text-center font-mono font-bold ${rankColor}">${index + 1}</td>
						<td class="py-3 pl-2 text-white font-semibold truncate max-w-[140px]">${escapeHtml(item.username)}</td>
						<td class="py-3 text-right pr-4 text-green-400 font-mono font-bold">${item.score.toLocaleString()}점</td>
					`;
					tbody.appendChild(row);
					index++;
				});
			} catch (error) {
				console.error("리더보드 최종 로드 실패:", error);
				if (tbody) {
					tbody.innerHTML = `<tr><td colspan="3" class="text-center py-12 text-red-400 text-xs font-bold">데이터를 불러오지 못했습니다.<br><span class="text-gray-500 font-normal">(네트워크 연결을 확인해보세요)</span></td></tr>`;
				}
			}
		}

		function escapeHtml(text) {
			if (!text) return '';
			return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
		}

		// 커스텀 모달 제어 함수
		function showModal({ title, message, showInput, showCancel, onConfirm }) {
			const modal = document.getElementById('customModal');
			const titleEl = document.getElementById('modalTitle');
			const msgEl = document.getElementById('modalMessage');
			const inputContainer = document.getElementById('inputContainer');
			const inputEl = document.getElementById('modalInput');
			const cancelBtn = document.getElementById('modalCancelBtn');
			const confirmBtn = document.getElementById('modalConfirmBtn');

			titleEl.textContent = title;
			msgEl.innerHTML = message.replace(/\n/g, '<br>');
			inputEl.value = '';
			
			if (showInput) inputContainer.classList.remove('hidden');
			else inputContainer.classList.add('hidden');

			if (showCancel) cancelBtn.classList.remove('hidden');
			else cancelBtn.classList.add('hidden');

			modal.style.display = 'flex';

			const newConfirmBtn = confirmBtn.cloneNode(true);
			confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
			
			const newCancelBtn = cancelBtn.cloneNode(true);
			cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

			newConfirmBtn.addEventListener('click', () => {
				modal.style.display = 'none';
				if (onConfirm) onConfirm(true, inputEl.value);
			});

			newCancelBtn.addEventListener('click', () => {
				modal.style.display = 'none';
				if (onConfirm) onConfirm(false, '');
			});
		}

		// 최고 점수 유무 판정 및 실시간 분기 저장 엔진 (커스텀 모달 버전)
		window.submitScore = async function(newScore) {
			if (newScore <= 0) {
				showModal({
					title: "GAME OVER",
					message: `최종 점수는 ${newScore}점입니다.\n0점은 명예의 전당에 등록할 수 없습니다.`,
					showInput: false,
					showCancel: false
				});
				return;
			}
			
			showModal({
				title: `🏆 ${rankMeta.label} 등록`,
				message: `게임 오버! 최종 점수는 ${newScore}점입니다.\n기록을 저장할 아이디를 입력해주세요:`,
				showInput: true,
				showCancel: true,
				onConfirm: async (confirmed, username) => {
					if (!confirmed || !username || username.trim() === "") {
						showModal({
							title: "등록 취소",
							message: "아이디가 입력되지 않아 기록이 취소되었습니다.",
							showInput: false,
							showCancel: false
						});
						return;
					}
					const trimmedName = username.trim();

					try {
						// 🌟 동적 컬렉션 주입 및 중복 검사 쿼리 최적화 연동
						const q = query(collection(db, ...rankPath), where("username", "==", trimmedName));
						const querySnapshot = await getDocs(q);
						
						let existingDocId = null;
						let existingScore = 0;

						if (!querySnapshot.empty) {
							const existingDoc = querySnapshot.docs[0];
							existingDocId = existingDoc.id;
							existingScore = existingDoc.data().score;
						}

						if (existingDocId) {
							if (newScore > existingScore) {
								showModal({
									title: "아이디 중복",
									message: `이미 명예의 전당에 동일한 아이디가 존재합니다.\n기존 점수: ${existingScore}점 -> 새 점수: ${newScore}점\n\n기존 기록에 새로운 더 높은 점수로 덮어씌우시겠습니까?\n(취소 시 별도의 새 기록으로 저장됩니다.)`,
									showInput: false,
									showCancel: true,
									onConfirm: async (overwrite) => {
										if (overwrite) {
											// 🌟 정식 확장 가변 트리 경로 매핑 문서 오버라이트 진행
											await setDoc(doc(db, ...[...rankPath, existingDocId]), {
												username: trimmedName,
												score: newScore,
												timestamp: Date.now()
											});
										}
										else {
											await addDoc(collection(db, ...rankPath), { username: trimmedName, score: newScore, timestamp: Date.now() });
										}
										showModal({ title: "등록 완료", message: "기록이 성공적으로 보존되었습니다!", showInput: false, showCancel: false });
										window.loadLeaderboard();
									}
								});
							} else {
								await addDoc(collection(db, ...rankPath), { username: trimmedName, score: newScore, timestamp: Date.now() });
								showModal({ title: "등록 완료", message: "기록이 성공적으로 보존되었습니다!", showInput: false, showCancel: false });
								window.loadLeaderboard();
							}
						} else {
							await addDoc(collection(db, ...rankPath), { username: trimmedName, score: newScore, timestamp: Date.now() });
							showModal({ title: "등록 완료", message: "기록이 성공적으로 보존되었습니다!", showInput: false, showCancel: false });
							window.loadLeaderboard();
						}
					} catch (error) {
						console.error("기록 저장 중 오류 발생:", error);
					}
				}
			});
		}

		// 선인증 처리 프로세스 탑재
		async function processAuthentication() {
			try {
				if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
					try { await signInWithCustomToken(auth, __initial_auth_token); } catch { await signInAnonymously(auth); }
				} else {
					await signInAnonymously(auth);
				}
				onAuthStateChanged(auth, (user) => {
					if (user) {
						currentUser = user;
						window.loadLeaderboard();
					}
				});
			} catch (e) {
				console.error("Auth Exception:", e);
				window.loadLeaderboard();
			}
		}

		// 🌟 실시간 라벨 및 데이터 구조 UI 동적 치환 가동
		window.addEventListener('load', () => {
			if (gameMeta && rankMeta) {
				document.getElementById('game-title-header').textContent = `🕹️ ${gameMeta.name.replace(/[^a-zA-Z]/g, '')} 🕹️`;
				document.getElementById('leaderboard-title').textContent = `🏆 ${rankMeta.label} 명예의 전당 (Top 10)`;
			}
			processAuthentication();
		});
	</script>

	<script type="text/javascript">
var NONE        = 4,
    UP          = 3,
    LEFT        = 2,
    DOWN        = 1,
    RIGHT       = 11,
    WAITING     = 5,
    PAUSE       = 6,
    PLAYING     = 7,
    COUNTDOWN   = 8,
    EATEN_PAUSE = 9,
    DYING       = 10,
    Pacman      = {};

Pacman.FPS = 30;

// 초기 사운드 기본값을 음소거("true") 상태로 설정 강제 적용
if (localStorage["soundDisabled"] === undefined) {
    localStorage["soundDisabled"] = "true";
}

Pacman.Ghost = function (game, map, colour) {

    var position  = null,
        direction = null,
        eatable   = null,
        eaten     = null,
        due       = null;
    
    function getNewCoord(dir, current) { 
        var levelBonus = (game.getLevel ? game.getLevel() : 1) - 1;
        var speed  = isVunerable() ? 1 : isHidden() ? 4 : (2 + levelBonus),
                xSpeed = (dir === LEFT && -speed || dir === RIGHT && speed || 0),
                ySpeed = (dir === DOWN && speed || dir === UP && -speed || 0);

            return {
                "x": addBounded(current.x, xSpeed),
                "y": addBounded(current.y, ySpeed)
            };
        };

    function addBounded(x1, x2) { 
        var rem    = x1 % 10, 
            result = rem + x2;
        if (rem !== 0 && result > 10) {
            return x1 + (10 - rem);
        } else if(rem > 0 && result < 0) { 
            return x1 - rem;
        }
        return x1 + x2;
    };
    
    function isVunerable() { 
        return eatable !== null;
    };
    
    function isDangerous() {
        return eaten === null;
    };

    function isHidden() { 
        return eatable === null && eaten !== null;
    };
    
    function getRandomDirection() {
        var moves = (direction === LEFT || direction === RIGHT) 
            ? [UP, DOWN] : [LEFT, RIGHT];
        return moves[Math.floor(Math.random() * 2)];
    };
    
    function reset() {
        eaten = null;
        eatable = null;
        position = {"x": 90, "y": 80};
        direction = getRandomDirection();
        due = getRandomDirection();
    };
    
    function onWholeSquare(x) {
        return x % 10 === 0;
    };
    
    function oppositeDirection(dir) { 
        return dir === LEFT && RIGHT ||
            dir === RIGHT && LEFT ||
            dir === UP && DOWN || UP;
    };

    function makeEatable() {
        direction = oppositeDirection(direction);
        eatable = game.getTick();
    };

    function eat() { 
        eatable = null;
        eaten = game.getTick();
    };

    function pointToCoord(x) {
        return Math.round(x / 10);
    };

    function nextSquare(x, dir) {
        var rem = x % 10;
        if (rem === 0) { 
            return x; 
        } else if (dir === RIGHT || dir === DOWN) { 
            return x + (10 - rem);
        } else {
            return x - rem;
        }
    };

    function onGridSquare(pos) {
        return onWholeSquare(pos.y) && onWholeSquare(pos.x);
    };

    function secondsAgo(tick) { 
        return (game.getTick() - tick) / Pacman.FPS;
    };

    function getColour() { 
        if (eatable) { 
            if (secondsAgo(eatable) > 5) { 
                return game.getTick() % 20 > 10 ? "#FFFFFF" : "#0000BB";
            } else { 
                return "#0000BB";
            }
        } else if(eaten) { 
            return "#222";
        } 
        return colour;
    };

    function draw(ctx) {
  
        var s    = map.blockSize, 
            top  = (position.y/10) * s,
            left = (position.x/10) * s;
    
        if (eatable && secondsAgo(eatable) > 8) {
            eatable = null;
        }
        
        if (eaten && secondsAgo(eaten) > 3) { 
            eaten = null;
        }
        
        var tl = left + s;
        var base = top + s - 3;
        var inc = s / 10;

        var high = game.getTick() % 10 > 5 ? 3  : -3;
        var low  = game.getTick() % 10 > 5 ? -3 : 3;

        ctx.fillStyle = getColour();
        ctx.beginPath();

        ctx.moveTo(left, base);

        ctx.quadraticCurveTo(left, top, left + (s/2),  top);
        ctx.quadraticCurveTo(left + s, top, left+s,  base);
        
        ctx.quadraticCurveTo(tl-(inc*1), base+high, tl - (inc * 2),  base);
        ctx.quadraticCurveTo(tl-(inc*3), base+low, tl - (inc * 4),  base);
        ctx.quadraticCurveTo(tl-(inc*5), base+high, tl - (inc * 6),  base);
        ctx.quadraticCurveTo(tl-(inc*7), base+low, tl - (inc * 8),  base); 
        ctx.quadraticCurveTo(tl-(inc*9), base+high, tl - (inc * 10), base); 

        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = "#FFF";
        ctx.arc(left + 6,top + 6, s / 6, 0, 300, false);
        ctx.arc((left + s) - 6,top + 6, s / 6, 0, 300, false);
        ctx.closePath();
        ctx.fill();

        var f = s / 12;
        var off = {};
        off[RIGHT] = [f, 0];
        off[LEFT]  = [-f, 0];
        off[UP]    = [0, -f];
        off[DOWN]  = [0, f];

        ctx.beginPath();
        ctx.fillStyle = "#000";
        ctx.arc(left+6+off[direction][0], top+6+off[direction][1], 
                s / 15, 0, 300, false);
        ctx.arc((left+s)-6+off[direction][0], top+6+off[direction][1], 
                s / 15, 0, 300, false);
        ctx.closePath();
        ctx.fill();

    };

    function pane(pos) {

        if (pos.y === 100 && pos.x >= 190 && direction === RIGHT) {
            return {"y": 100, "x": -10};
        }
        
        if (pos.y === 100 && pos.x <= -10 && direction === LEFT) {
            return position = {"y": 100, "x": 190};
        }

        return false;
    };
    
    function move(ctx) {
        
        var oldPos = position,
            onGrid = onGridSquare(position),
            npos   = null;
        
        if (due !== direction) {
            
            npos = getNewCoord(due, position);
            
            if (onGrid &&
                map.isFloorSpace({
                    "y":pointToCoord(nextSquare(npos.y, due)),
                    "x":pointToCoord(nextSquare(npos.x, due))})) {
                direction = due;
            } else {
                npos = null;
            }
        }
        
        if (npos === null) {
            npos = getNewCoord(direction, position);
        }
        
        if (onGrid &&
            map.isWallSpace({
                "y" : pointToCoord(nextSquare(npos.y, direction)),
                "x" : pointToCoord(nextSquare(npos.x, direction))
            })) {
            
            due = getRandomDirection();            
            return move(ctx);
        }

        position = npos;        
        
        var tmp = pane(position);
        if (tmp) { 
            position = tmp;
        }
        
        due = getRandomDirection();
        
        return {
            "new" : position,
            "old" : oldPos
        };
    };
    
    return {
        "eat"         : eat,
        "isVunerable" : isVunerable,
        "isDangerous" : isDangerous,
        "makeEatable" : makeEatable,
        "reset"       : reset,
        "move"        : move,
        "draw"        : draw
    };
};

Pacman.User = function (game, map) {
    
    var position  = null,
        direction = null,
        eaten     = null,
        due       = null, 
        lives     = null,
        score     = 5,
        keyMap    = {};
    
    keyMap[KEY.ARROW_LEFT]  = LEFT;
    keyMap[KEY.ARROW_UP]    = UP;
    keyMap[KEY.ARROW_RIGHT] = RIGHT;
    keyMap[KEY.ARROW_DOWN]  = DOWN;

    function addScore(nScore) { 
        score += nScore;

    };

    function theScore() { 
        return score;
    };

    function loseLife() { 
        lives -= 1;
    };

    function getLives() {
        return lives;
    };

    function initUser() {
        score = 0;
        lives = 3;
        newLevel();
    }
    
    function newLevel() {
        resetPosition();
        eaten = 0;
    };
    
    function resetPosition() {
        position = {"x": 90, "y": 120};
        direction = LEFT;
        due = LEFT;
    };
    
    function reset() {
        initUser();
        resetPosition();
    };        
    
    function keyDown(e) {
        if (typeof keyMap[e.keyCode] !== "undefined") { 
            due = keyMap[e.keyCode];
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        return true;
	};

    function getNewCoord(dir, current) {   
        return {
            "x": current.x + (dir === LEFT && -2 || dir === RIGHT && 2 || 0),
            "y": current.y + (dir === DOWN && 2 || dir === UP    && -2 || 0)
        };
    };

    function onWholeSquare(x) {
        return x % 10 === 0;
    };

    function pointToCoord(x) {
        return Math.round(x/10);
    };
    
    function nextSquare(x, dir) {
        var rem = x % 10;
        if (rem === 0) { 
            return x; 
        } else if (dir === RIGHT || dir === DOWN) { 
            return x + (10 - rem);
        } else {
            return x - rem;
        }
    };

    function next(pos, dir) {
        return {
            "y" : pointToCoord(nextSquare(pos.y, dir)),
            "x" : pointToCoord(nextSquare(pos.x, dir)),
        };                               
    };

    function onGridSquare(pos) {
        return onWholeSquare(pos.y) && onWholeSquare(pos.x);
    };

    function isOnSamePlane(due, dir) { 
        return ((due === LEFT || due === RIGHT) && 
                (dir === LEFT || dir === RIGHT)) || 
            ((due === UP || due === DOWN) && 
             (dir === UP || dir === DOWN));
    };

    function move(ctx) {
        
        var npos        = null, 
            nextWhole   = null, 
            oldPosition = position,
            block       = null;
        
        if (due !== direction) {
            npos = getNewCoord(due, position);
            
            if (isOnSamePlane(due, direction) || 
                (onGridSquare(position) && 
                 map.isFloorSpace(next(npos, due)))) {
                direction = due;
            } else {
                npos = null;
            }
        }

        if (npos === null) {
            npos = getNewCoord(direction, position);
        }
        
        if (onGridSquare(position) && map.isWallSpace(next(npos, direction))) {
            direction = NONE;
        }

        if (direction === NONE) {
            return {"new" : position, "old" : position};
        }
        
        if (npos.y === 100 && npos.x >= 190 && direction === RIGHT) {
            npos = {"y": 100, "x": -10};
        }
        
        if (npos.y === 100 && npos.x <= -12 && direction === LEFT) {
            npos = {"y": 100, "x": 190};
        }
        
        position = npos;        
        nextWhole = next(position, direction);
        
        block = map.block(nextWhole);        
        
        if ((isMidSquare(position.y) || isMidSquare(position.x)) &&
            block === Pacman.BISCUIT || block === Pacman.PILL) {
            
            map.setBlock(nextWhole, Pacman.EMPTY);           
            addScore((block === Pacman.BISCUIT) ? 10 : 50);
            eaten += 1;
            
            if (eaten === 182) {
                game.completedLevel();
            }
            
            if (block === Pacman.PILL) { 
                game.eatenPill();
            }
        }   
                
        return {
            "new" : position,
            "old" : oldPosition
        };
    };

    function isMidSquare(x) { 
        var rem = x % 10;
        return rem > 3 || rem < 7;
    };

    function calcAngle(dir, pos) { 
        if (dir == RIGHT && (pos.x % 10 < 5)) {
            return {"start":0.25, "end":1.75, "direction": false};
        } else if (dir === DOWN && (pos.y % 10 < 5)) { 
            return {"start":0.75, "end":2.25, "direction": false};
        } else if (dir === UP && (pos.y % 10 < 5)) { 
            return {"start":1.25, "end":1.75, "direction": true};
        } else if (dir === LEFT && (pos.x % 10 < 5)) {             
            return {"start":0.75, "end":1.25, "direction": true};
        }
        return {"start":0, "end":2, "direction": false};
    };

    function drawDead(ctx, amount) { 

        var size = map.blockSize, 
            half = size / 2;

        if (amount >= 1) { 
            return;
        }

        ctx.fillStyle = "#FFFF00";
        ctx.beginPath();        
        ctx.moveTo(((position.x/10) * size) + half, 
                   ((position.y/10) * size) + half);
        
        ctx.arc(((position.x/10) * size) + half, 
                ((position.y/10) * size) + half,
                half, 0, Math.PI * 2 * amount, true); 
        
        ctx.fill();    
    };

    function draw(ctx) { 

        var s     = map.blockSize, 
            angle = calcAngle(direction, position);

        ctx.fillStyle = "#FFFF00";

        ctx.beginPath();        

        ctx.moveTo(((position.x/10) * s) + s / 2,
                   ((position.y/10) * s) + s / 2);
        
        ctx.arc(((position.x/10) * s) + s / 2,
                ((position.y/10) * s) + s / 2,
                s / 2, Math.PI * angle.start, 
                Math.PI * angle.end, angle.direction); 
        
        ctx.fill();    
    };
    
    initUser();

    return {
        "draw"          : draw,
        "drawDead"      : drawDead,
        "loseLife"      : loseLife,
        "getLives"      : getLives,
        "score"         : score,
        "addScore"      : addScore,
        "theScore"      : theScore,
        "keyDown"       : keyDown,
        "move"          : move,
        "newLevel"      : newLevel,
        "reset"         : reset,
        "resetPosition" : resetPosition
    };
};

Pacman.Map = function (daySize) {
    
    var height    = null, 
        width     = null, 
        blockSize = daySize,
        pillSize  = 0,
        map       = null;
    
    function withinBounds(y, x) {
        return y >= 0 && y < height && x >= 0 && x < width;
    }
    
    function isWall(pos) {
        return withinBounds(pos.y, pos.x) && map[pos.y][pos.x] === Pacman.WALL;
    }
    
    function isFloorSpace(pos) {
        if (!withinBounds(pos.y, pos.x)) {
            return false;
        }
        var peice = map[pos.y][pos.x];
        return peice === Pacman.EMPTY || 
            peice === Pacman.BISCUIT ||
            peice === Pacman.PILL;
    }
    
    function drawWall(ctx) {

        var i, j, p, line;
        
        ctx.strokeStyle = "#0000FF";
        ctx.lineWidth   = 5;
        ctx.lineCap     = "round";
        
        for (i = 0; i < Pacman.WALLS.length; i += 1) {
            line = Pacman.WALLS[i];
            ctx.beginPath();

            for (j = 0; j < line.length; j += 1) {

                p = line[j];
                
                if (p.move) {
                    ctx.moveTo(p.move[0] * blockSize, p.move[1] * blockSize);
                } else if (p.line) {
                    ctx.lineTo(p.line[0] * blockSize, p.line[1] * blockSize);
                } else if (p.curve) {
                    ctx.quadraticCurveTo(p.curve[0] * blockSize, 
                                         p.curve[1] * blockSize,
                                         p.curve[2] * blockSize, 
                                         p.curve[3] * blockSize);   
                }
            }
            ctx.stroke();
        }
    }
    
    function reset() {       
        map    = Pacman.MAP.clone();
        height = map.length;
        width  = map[0].length;        
    };

    function block(pos) {
        return map[pos.y][pos.x];
    };
    
    function setBlock(pos, type) {
        map[pos.y][pos.x] = type;
    };

    function drawPills(ctx) { 

        if (++pillSize > 30) {
            pillSize = 0;
        }
        
        for (var i = 0; i < height; i += 1) {
		    for (var j = 0; j < width; j += 1) {
                if (map[i][j] === Pacman.PILL) {
                    ctx.beginPath();

                    ctx.fillStyle = "#000";
		            ctx.fillRect((j * blockSize), (i * blockSize), 
                                 blockSize, blockSize);

                    ctx.fillStyle = "#FFF";
                    ctx.arc((j * blockSize) + blockSize / 2,
                            (i * blockSize) + blockSize / 2,
                            Math.abs(5 - (pillSize/3)), 
                            0, 
                            Math.PI * 2, false); 
                    ctx.fill();
                    ctx.closePath();
                }
		    }
	    }
    };
    
    function draw(ctx) {
        
        var i, j, size = blockSize;

        ctx.fillStyle = "#000";
	    ctx.fillRect(0, 0, width * size, height * size);

        drawWall(ctx);
        
        for (i = 0; i < height; i += 1) {
		    for (j = 0; j < width; j += 1) {
			    drawBlock(i, j, ctx);
		    }
	    }
    };
    
    function drawBlock(y, x, ctx) {

        var layout = map[y][x];

        if (layout === Pacman.PILL) {
            return;
        }

        ctx.beginPath();
        
        if (layout === Pacman.EMPTY || layout === Pacman.BLOCK || 
            layout === Pacman.BISCUIT) {
            
            ctx.fillStyle = "#000";
		    ctx.fillRect((x * blockSize), (y * blockSize), 
                         blockSize, blockSize);

            if (layout === Pacman.BISCUIT) {
                ctx.fillStyle = "#FFF";
		        ctx.fillRect((x * blockSize) + (blockSize / 2.5), 
                             (y * blockSize) + (blockSize / 2.5), 
                             blockSize / 6, blockSize / 6);
	        }
        }
        ctx.closePath();	 
    };

    reset();
    
    return {
        "draw"         : draw,
        "drawBlock"    : drawBlock,
        "drawPills"    : drawPills,
        "block"        : block,
        "setBlock"     : setBlock,
        "reset"        : reset,
        "isWallSpace"  : isWall,
        "isFloorSpace" : isFloorSpace,
        "height"       : height,
        "width"        : width,
        "blockSize"    : blockSize
    };
};

Pacman.Audio = function(game) {
    
    var files          = [], 
        endEvents      = [],
        progressEvents = [],
        playing        = [];
    
    function load(name, path, cb) { 

        var f = files[name] = document.createElement("audio");

        progressEvents[name] = function(event) { progress(event, name, cb); };
        
        f.addEventListener("canplaythrough", progressEvents[name], true);
        f.setAttribute("preload", "true");
        f.setAttribute("autobuffer", "true");
        f.setAttribute("src", path);
        f.pause();        
    };

    function progress(event, name, callback) { 
        if (event.loaded === event.total && typeof callback === "function") {
            callback();
            files[name].removeEventListener("canplaythrough", 
                                            progressEvents[name], true);
        }
    };

    function disableSound() {
        for (var i = 0; i < playing.length; i++) {
            files[playing[i]].pause();
            files[playing[i]].currentTime = 0;
        }
        playing = [];
    };

    function ended(name) { 

        var i, tmp = [], found = false;

        files[name].removeEventListener("ended", endEvents[name], true);

        for (i = 0; i < playing.length; i++) {
            if (!found && playing[i]) { 
                found = true;
            } else { 
                tmp.push(playing[i]);
            }
        }
        playing = tmp;
    };

    function play(name) { 
        if (!game.soundDisabled()) {
            endEvents[name] = function() { ended(name); };
            playing.push(name);
            files[name].addEventListener("ended", endEvents[name], true);
            files[name].play();
        }
    };

    function pause() { 
        for (var i = 0; i < playing.length; i++) {
            files[playing[i]].pause();
        }
    };
    
    function resume() { 
        for (var i = 0; i < playing.length; i++) {
            files[playing[i]].play();
        }        
    };
    
    return {
        "disableSound" : disableSound,
        "load"         : load,
        "play"         : play,
        "pause"        : pause,
        "resume"       : resume
    };
};

var PACMAN = (function () {

    var state        = WAITING,
        audio        = null,
        ghosts       = [],
        ghostSpecs   = ["#00FFDE", "#FF0000", "#FFB8DE", "#FFB847"],
        eatenCount   = 0,
        level        = 0,
        tick         = 0,
        ghostPos, userPos, 
        stateChanged = true,
        timerStart   = null,
        lastTime     = 0,
        ctx          = null,
        timer        = null,
        map          = null,
        user         = null,
        stored       = null;
        isGameOverSubmitted = false;

    function initGhosts() {
    ghosts = [];
    var totalGhosts = 4 + (level - 1); // 레벨당 1마리씩 증가 (기본 4마리)
    for (var i = 0; i < totalGhosts; i++) {
        var colour = ghostSpecs[i % ghostSpecs.length]; // 4가지 색상 돌려쓰기
        // 유령에게 현재 레벨을 전달할 수 있도록 getLevel을 주입합니다.
        ghost = new Pacman.Ghost({"getTick": getTick, "getLevel": function() { return level; }}, map, colour);
        ghosts.push(ghost);
    }
}

    function getTick() { 
        return tick;
    };

    function drawScore(text, position) {
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "11px 'Press Start 2P', sans-serif";
        ctx.fillText(text, 
                     (position["new"]["x"] / 10) * map.blockSize, 
                     ((position["new"]["y"] + 5) / 10) * map.blockSize);
    }
    
	// 인게임 하단 중앙 폰트 예쁘게 스타일 적용
    function dialog(text) {
        ctx.fillStyle = "#FFFF00";
        ctx.font = "bold 13px 'Noto Sans KR', sans-serif";
        var width = ctx.measureText(text).width,
            x     = ((map.width * map.blockSize) - width) / 2;        
        ctx.fillText(text, x, (map.height * 10) + 8);
    }

    function soundDisabled() {
        return localStorage["soundDisabled"] === "true";
    };
    
    function startLevel() {        
        user.resetPosition();
        for (var i = 0; i < ghosts.length; i += 1) { 
            ghosts[i].reset();
        }
        audio.play("start");
        timerStart = tick;
        setState(COUNTDOWN);
    }    

    function startNewGame() {
        setState(WAITING);
        isGameOverSubmitted = false;
        level = 1;
        user.reset();
        map.reset();
        map.draw(ctx);
        initGhosts();
        startLevel();
    }

    function keyDown(e) {
        if (e.keyCode === KEY.N) {
            startNewGame();
        } else if (e.keyCode === KEY.S) {
            audio.disableSound();
            localStorage["soundDisabled"] = !soundDisabled();
        } else if (e.keyCode === KEY.P && state === PAUSE) {
            audio.resume();
            map.draw(ctx);
            setState(stored);
        } else if (e.keyCode === KEY.P) {
            stored = state;
            setState(PAUSE);
            audio.pause();
            map.draw(ctx);
            dialog("일시 정지됨 (재개하려면 P키 입력)");
        } else if (state !== PAUSE) {   
            return user.keyDown(e);
        }
        return true;
    }    

    // 게임 오버 연동 5-1, 5-2 조건 완벽 실행 바인딩
    function loseLife() {        
        user.loseLife();
        if (user.getLives() > 0) {
            setState(WAITING);
            startLevel();
        } else {
            setState(WAITING);
            map.draw(ctx);
            dialog("게임 오버! 새 게임은 N키를 누르세요.");
            
            // 플래그가 false일 때만 단 한 번 실행하도록 잠금을 겁니다.
            if (!isGameOverSubmitted) {
                isGameOverSubmitted = true; 
                const finalScore = user.theScore();
                setTimeout(function() {
                    if (window.submitScore) {
                        window.submitScore(finalScore);
                    }
                }, 400);
            }
        }
    }

    function setState(nState) { 
        state = nState;
        stateChanged = true;
    };
    
    function collided(user, ghost) {
        return (Math.sqrt(Math.pow(ghost.x - user.x, 2) + 
                          Math.pow(ghost.y - user.y, 2))) < 10;
    };

    // 소리 제어 UI 이모지 🔇 / 🔊 매핑 렌더링 파트
    function drawFooter() {
        var topLeft  = (map.height * map.blockSize),
            textBase = topLeft + 18;
        
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, topLeft, (map.width * map.blockSize), 30);
        
        ctx.fillStyle = "#FFFF00";

        for (var i = 0, len = user.getLives(); i < len; i++) {
            ctx.fillStyle = "#FFFF00";
            ctx.beginPath();
            ctx.moveTo(150 + (25 * i) + map.blockSize / 2,
                       (topLeft+1) + map.blockSize / 2);
            
            ctx.arc(150 + (25 * i) + map.blockSize / 2,
                    (topLeft+1) + map.blockSize / 2,
                    map.blockSize / 2, Math.PI * 0.25, Math.PI * 1.75, false);
            ctx.fill();
        }

        // 반응형 사운드 제어 이모지 적용
        ctx.font = "15px sans-serif";
        ctx.fillText(soundDisabled() ? "🔇" : "🔊", 12, textBase);

        ctx.fillStyle = "#FFFF00";
        ctx.font = "bold 13px 'Noto Sans KR', sans-serif";
        ctx.fillText("점수: " + user.theScore(), 48, textBase - 1);
        ctx.fillText("레벨: " + level, 285, textBase - 1);
    }

    function redrawBlock(pos) {
        map.drawBlock(Math.floor(pos.y/10), Math.floor(pos.x/10), ctx);
        map.drawBlock(Math.ceil(pos.y/10), Math.ceil(pos.x/10), ctx);
    }

    function mainDraw() { 

        var diff, u, i, len, nScore;
        
        ghostPos = [];

        for (i = 0, len = ghosts.length; i < len; i += 1) {
            ghostPos.push(ghosts[i].move(ctx));
        }
        u = user.move(ctx);
        
        for (i = 0, len = ghosts.length; i < len; i += 1) {
            redrawBlock(ghostPos[i].old);
        }
        redrawBlock(u.old);
        
        for (i = 0, len = ghosts.length; i < len; i += 1) {
            ghosts[i].draw(ctx);
        }                     
        user.draw(ctx);
        
        userPos = u["new"];
        
        for (i = 0, len = ghosts.length; i < len; i += 1) {
            if (collided(userPos, ghostPos[i]["new"])) {
                if (ghosts[i].isVunerable()) { 
                    audio.play("eatghost");
                    ghosts[i].eat();
                    eatenCount += 1;
                    nScore = eatenCount * 50;
                    drawScore(nScore, ghostPos[i]);
                    user.addScore(nScore);                    
                    setState(EATEN_PAUSE);
                    timerStart = tick;
                } else if (ghosts[i].isDangerous()) {
                    audio.play("die");
                    setState(DYING);
                    timerStart = tick;
                }
            }
        }                             
    };

    function mainLoop() {

        var diff;

        if (state !== PAUSE) { 
            ++tick;
        }

        map.drawPills(ctx);

        if (state === PLAYING) {
            mainDraw();
        } else if (state === WAITING && stateChanged) {            
            stateChanged = false;
            map.draw(ctx);
            dialog("새 게임을 시작하려면 [N] 키를 누르세요");            
        } else if (state === EATEN_PAUSE && 
                   (tick - timerStart) > (Pacman.FPS / 3)) {
            map.draw(ctx);
            setState(PLAYING);
        } else if (state === DYING) {
            if (tick - timerStart > (Pacman.FPS * 2)) { 
                loseLife();
            } else { 
                redrawBlock(userPos);
                for (var i = 0, len = ghosts.length; i < len; i += 1) {
                    redrawBlock(ghostPos[i].old);
                    ghostPos.push(ghosts[i].draw(ctx));
                }                                   
                user.drawDead(ctx, (tick - timerStart) / (Pacman.FPS * 2));
            }
        } else if (state === COUNTDOWN) {
            
            diff = 3 + Math.floor((timerStart - tick) / Pacman.FPS);
            
            if (diff === 0) {
                map.draw(ctx);
                setState(PLAYING);
            } else {
                if (diff !== lastTime) { 
                    lastTime = diff;
                    map.draw(ctx);
                    dialog("게임 시작까지: " + diff);
                }
            }
        } 

        drawFooter();
    }

    function eatenPill() {
        audio.play("eatpill");
        timerStart = tick;
        eatenCount = 0;
        for (var i = 0; i < ghosts.length; i += 1) {
            ghosts[i].makeEatable(ctx);
        }        
    };
    
    function completedLevel() {
        setState(WAITING);
        level += 1;
        map.reset();
        user.newLevel();
        initGhosts();
        startLevel();
    };

    function keyPress(e) { 
        if (state !== WAITING && state !== PAUSE) { 
            e.preventDefault();
            e.stopPropagation();
        }
    };
    
    function init(wrapper, root) {
        
        var i, len, ghost,
            blockSize = wrapper.offsetWidth / 19,
            canvas    = document.createElement("canvas");
        
        canvas.setAttribute("width", (blockSize * 19) + "px");
        canvas.setAttribute("height", (blockSize * 22) + 30 + "px");

        wrapper.appendChild(canvas);

        ctx  = canvas.getContext('2d');

        audio = new Pacman.Audio({"soundDisabled":soundDisabled});
        map   = new Pacman.Map(blockSize);
        user  = new Pacman.User({ 
            "completedLevel" : completedLevel, 
            "eatenPill"      : eatenPill 
        }, map);

        for (i = 0, len = ghostSpecs.length; i < len; i += 1) {
            ghost = new Pacman.Ghost({"getTick":getTick}, map, ghostSpecs[i]);
            ghosts.push(ghost);
        }
        
        map.draw(ctx);
        dialog("오디오 로딩 중...");

        var extension = Modernizr.audio.ogg ? 'ogg' : 'mp3';

        var audio_files = [
            ["start", root + "audio/opening_song." + extension],
            ["die", root + "audio/die." + extension],
            ["eatghost", root + "audio/eatghost." + extension],
